opencollection: 1.0.0

info:
  name: Bitdefender Control Center APIs
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Basic {{TOKEN}}
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
